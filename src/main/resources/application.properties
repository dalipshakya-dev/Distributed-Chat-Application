spring.application.name=Chat-Application

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true

jwt.expiration-ms=900000

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}


#Redis
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.port=6379


# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest


# Actuator ? health and readiness
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.readiness.include=db,redis
management.endpoint.health.group.liveness.include=ping
management.metrics.tags.node=${INSTANCE_ID:local}

# Graceful shutdown: finish in-flight requests before the JVM exits
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s


spring.jpa.open-in-view=false
spring.profiles.active=dev


logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-none}] %logger{36} - %msg%n


# REDIS TIMEOUT
spring.data.redis.timeout=500ms



