services:

  mysql:
    image: mysql:8.3.0
    container_name: chat-application-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: chat_application
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4.1
    container_name: chat-application-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --save 300 10
      --dir /data
      --dbfilename dump.rdb
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: chat-application-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data

  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-application-backend1
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - docker-compose.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/chat_application
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INSTANCE_ID: backend1
    depends_on:
      - mysql
      - redis
      - kafka

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-application-backend2
    restart: always
    ports:
      - "8081:8080"
    env_file:
      - docker-compose.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/chat_application
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INSTANCE_ID: backend2
    depends_on:
      - mysql
      - redis
      - kafka

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: chat-application-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend1
      - backend2

  grafana:
    image: grafana/grafana:11.2.0
    container_name: chat-application-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.2.0
    container_name: chat-application-loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.0
    container_name: chat-application-promtail
    restart: always
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions
    depends_on:
      - loki

volumes:
  mysql-data:
  kafka-data:
  redis-data:
  grafana-data:
  loki-data:
  promtail-positions: